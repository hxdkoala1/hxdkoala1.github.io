name: reading_novels
description: An EPUB reading library for the web and Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  epub_view: ^3.3.0
  flutter:
    sdk: flutter
  google_sign_in_all_platforms: ^2.0.3
  html: 0.15.6
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true