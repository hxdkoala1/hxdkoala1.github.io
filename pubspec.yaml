name: reading_novels
description: An EPUB reading library for the web and Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  epub_view: ^3.3.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  hive_ce_flutter: ^2.5.0
  html: 0.15.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true